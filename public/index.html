<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgenticPay AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <header>
      <h1>🤖 AgenticPay AI</h1>
      <p>Autonomous AI Shopping & Instant PayPal Checkout</p>
    </header>
    <div id="chat-messages" class="chat-messages">
      <div class="message assistant">Hello! Tell me what product or technical service you need today.</div>
    </div>
    <form id="chat-form" class="chat-form">
      <input type="text" id="chat-input" placeholder="e.g., I need AI API credits..." required />
      <button type="submit">Send</button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
