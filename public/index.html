<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgenticPay AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1>🤖 AgenticPay AI</h1>
      <p>Autonomous AI Shopping & Instant PayPal Checkout</p>
    </header>

    <main class="chat-wrapper">
      <div id="chat-box" class="chat-box">
        <div class="message agent">
          Hello! Tell me what product or technical service you need today.
        </div>
      </div>

      <div class="input-bar">
        <input type="text" id="user-input" placeholder="e.g., I need AI API credits..." />
        <button id="send-btn">Send</button>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
